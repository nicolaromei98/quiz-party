[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# l'HTML non va messo in cache: così tutti i telefoni prendono sempre l'ultima versione
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
